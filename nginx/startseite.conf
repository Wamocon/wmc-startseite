server {
    listen 80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Kein Verzeichnislisting.
    autoindex off;

    # Header (B-03).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Änderungen sollen beim nächsten Öffnen ankommen (B-03).
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /app.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /styles.css {
        add_header Cache-Control "no-cache" always;
    }

    location = /daten/links.json {
        add_header Cache-Control "no-cache" always;
    }

    # Schriften und Logos dürfen bis zu 7 Tage gecacht werden (B-03).
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Fallback: unbekannte Pfade geben 404, kein Listing.
    location / {
        try_files $uri $uri/ =404;
    }
}
