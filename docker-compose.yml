services:
  startseite:
    build:
      context: .
      dockerfile: Dockerfile
    image: wamocon/startseite:latest
    container_name: wmc-startseite
    ports:
      - "8080:80"
    environment:
      LINKS_VERZEICHNIS: ${LINKS_VERZEICHNIS:-./daten/beispiel}
    volumes:
      # Das VERZEICHNIS wird schreibgeschützt eingebunden (B-02), weil Editoren
      # beim Speichern oft eine neue Datei anlegen und eine eingebundene
      # Einzeldatei dann im Container veraltet wäre.
      - ${LINKS_VERZEICHNIS:-./daten/beispiel}:/usr/share/nginx/html/daten:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
